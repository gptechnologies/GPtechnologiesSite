  </g>
  <g id="chainideas-output-token" class="ci-token">
    <circle cx="370" cy="211" r="13.5" fill="#f7f5ef" stroke="#bb9974" stroke-width="1.4" />
    <circle cx="370" cy="211" r="4.3" fill="#c9926c" />
  </g>
  <g id="chainideas-engine">
    <text class="ci-mono" x="274" y="97" font-size="11" text-anchor="middle">DISCOVERY ENGINE</text>
    <g id="chainideas-engine-body" class="ci-outline">
      <path d="M213 152L228 143L341 172L326 181Z" fill="#d8cbbb" />
      <path d="M326 181L341 172V284L326 293Z" fill="#d5c7b4" />
      <path d="M213 152L326 181V293L213 264Z" fill="#eae5da" />
    </g>
    <g id="chainideas-criteria" transform="matrix(1 .256637 0 1 213 152)">
      <circle cx="19" cy="30" r="7" class="ci-criterion-empty" />
      <circle cx="19" cy="30" r="7" class="ci-criterion-fill ci-criterion-age" />
      <text x="34" y="34" class="ci-criteria-label">Age</text>
      <circle cx="19" cy="61" r="7" class="ci-criterion-empty" />
      <circle cx="19" cy="61" r="7" class="ci-criterion-fill ci-criterion-volume" />
      <text x="34" y="65" class="ci-criteria-label">Volume</text>
      <circle cx="19" cy="92" r="7" class="ci-criterion-empty" />
      <circle cx="19" cy="92" r="7" class="ci-criterion-fill ci-criterion-liquidity" />
      <text x="34" y="96" class="ci-criteria-label">Liquidity</text>
    </g>
    <g id="chainideas-engine-side-slashes" stroke="#a89d8c" stroke-width="2" stroke-linecap="round">
      <path d="M331 199l6-4M331 222l6-4M331 245l6-4" />
    </g>
  </g>
  <g id="chainideas-monitor">
    <text class="ci-mono" x="466" y="97" font-size="11" text-anchor="middle">QUALIFIED PAIRS</text>
    <g id="chainideas-monitor-case" class="ci-outline">
      <path d="M399 130L411 122L524 150L512 158Z" fill="#d9cdbd" />
      <path d="M512 158L524 150V294L512 302Z" fill="#d4c5b4" />
      <path d="M399 130L512 158V302L399 274Z" fill="#f2efe8" />
      <path d="M449 288L449 322L468 327L468 293" fill="#dcd1c3" />
      <path d="M434 327L478 338L489 333L448 322Z" fill="#e7e0d6" />
    </g>
    <g id="chainideas-monitor-rows" transform="matrix(1 0.247 0 1 0 -98.5)">
      <path d="M408 169H501M408 197H501M408 225H501" stroke="#e1dbd2" stroke-width="1" />
      <g id="chainideas-qualified-row-1" class="ci-result-row">
        <circle cx="416" cy="152" r="4.5" fill="#a5b29e" />
        <path d="M428 149h31M428 155h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round" />
        <g fill="#93a98f">
          <rect x="473" y="150" width="5" height="13" class="ci-bar" />
          <rect x="482" y="142" width="5" height="21" class="ci-bar" />
        </g>
        <rect x="491" y="136" width="5" height="27" fill="#c99f84" class="ci-bar" />
      </g>
      <g id="chainideas-qualified-row-2" class="ci-result-row">
        <circle cx="416" cy="180" r="4.5" fill="#a5b29e" />
        <path d="M428 177h31M428 183h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round" />
        <g fill="#93a98f">
          <rect x="473" y="175" width="5" height="16" class="ci-bar" />
          <rect x="482" y="169" width="5" height="22" class="ci-bar" />
        </g>
        <rect x="491" y="178" width="5" height="13" fill="#c99f84" class="ci-bar" />
      </g>
      <g id="chainideas-qualified-row-3" class="ci-result-row">
        <circle cx="416" cy="208" r="4.5" fill="#a5b29e" />
        <path d="M428 205h31M428 211h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round" />
        <g fill="#93a98f">
          <rect x="473" y="206" width="5" height="13" class="ci-bar" />
          <rect x="482" y="199" width="5" height="20" class="ci-bar" />
        </g>
        <rect x="491" y="195" width="5" height="24" fill="#c99f84" class="ci-bar" />
      </g>
      <g id="chainideas-qualified-row-4" class="ci-result-row">
        <circle cx="416" cy="236" r="4.5" fill="#a5b29e" />
        <path d="M428 233h31M428 239h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round" />
        <g fill="#93a98f">
          <rect x="473" y="235" width="5" height="12" class="ci-bar" />
          <rect x="482" y="226" width="5" height="21" class="ci-bar" />
        </g>
        <rect x="491" y="220" width="5" height="27" fill="#c99f84" class="ci-bar" />
      </g>
    </g>
  </g>
</svg>
