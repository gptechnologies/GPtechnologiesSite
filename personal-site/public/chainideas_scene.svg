<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" class="chainideas-artwork" role="img" aria-labelledby="chainideas-title chainideas-desc">
  <title id="chainideas-title">ChainIdeas discovery engine</title>
  <desc id="chainideas-desc">Solana and Robinhood Chain send data to Discovery. Age, Volume, and Liquidity turn green before a qualified token is sent to the results dashboard.</desc>
  <style>
/* ChainIdeas: final isometric artwork; input → three checks → qualified output. */
.chainideas-artwork .ci-outline { stroke: #9c9080; stroke-width: 1.35; stroke-linejoin: round; stroke-linecap: round; }
.chainideas-artwork .ci-fine { stroke: #c6bcae; stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; }
.chainideas-artwork .ci-mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; fill: #817669; letter-spacing: 1.05px; }
.chainideas-artwork .ci-criteria-label { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .1px; fill: #756b5e; }
.chainideas-artwork .ci-criterion-empty { fill: #f7f5ef; stroke: #a79a89; stroke-width: 1.5; }
.chainideas-artwork .ci-criterion-fill { fill: #809370; stroke: #718564; stroke-width: 1.5; }
.chainideas-artwork .ci-token, .chainideas-artwork .ci-criterion-fill { opacity: 0; }
.chainideas-artwork #chainideas-solana-token { animation: ci-input-solana 8s linear infinite; }
.chainideas-artwork #chainideas-robinhood-token { animation: ci-input-robinhood 8s linear infinite; }
.chainideas-artwork .ci-criterion-age { animation: ci-check-age 8s ease-in-out infinite; }
.chainideas-artwork .ci-criterion-volume { animation: ci-check-volume 8s ease-in-out infinite; }
.chainideas-artwork .ci-criterion-liquidity { animation: ci-check-liquidity 8s ease-in-out infinite; }
.chainideas-artwork #chainideas-output-token { animation: ci-send-qualified 8s var(--ease-in-out, cubic-bezier(.65, 0, .35, 1)) infinite; }
.chainideas-artwork .ci-result-row { opacity: .15; animation: ci-results 8s ease-in-out infinite; }
.chainideas-artwork .ci-bar { transform-box: fill-box; transform-origin: center bottom; transform: scaleY(.1); animation: ci-result-bars 8s var(--ease-out, cubic-bezier(.23, 1, .32, 1)) infinite; }

/* 0–2s: both source tokens follow their guide lines into Discovery. */
@keyframes ci-input-solana {
  0% { opacity: 0; transform: translate(-42px, -24.5px); }
  3% { opacity: 1; transform: translate(-42px, -24.5px); }
  13% { opacity: 1; transform: translate(-3.4px, -10.6px); }
  22% { opacity: 1; transform: translate(29px, 5.5px); }
  25%, 100% { opacity: 0; transform: translate(37px, 6.5px); }
}
@keyframes ci-input-robinhood {
  0%, 4% { opacity: 0; transform: translate(-42px, 16.5px); }
  7% { opacity: 1; transform: translate(-42px, 16.5px); }
  15% { opacity: 1; transform: translate(-3px, -4px); }
  22% { opacity: 1; transform: translate(29px, -23px); }
  25%, 100% { opacity: 0; transform: translate(37px, -25.5px); }
}
/* 2–4s: qualify Age, Volume, and Liquidity in order. */
@keyframes ci-check-age {
  0%, 25%, 100% { opacity: 0; }
  31.25%, 94% { opacity: 1; }
}
@keyframes ci-check-volume {
  0%, 34.375%, 100% { opacity: 0; }
  40.625%, 94% { opacity: 1; }
}
@keyframes ci-check-liquidity {
  0%, 43.75%, 100% { opacity: 0; }
  50%, 94% { opacity: 1; }
}
/* 4–6s: send only after all three checks pass, then populate the monitor. */
@keyframes ci-send-qualified {
  0%, 52% { opacity: 0; transform: translate(-29px, 0); }
  54% { opacity: 1; transform: translate(-29px, 0); }
  64% { opacity: 1; transform: translate(23px, 0); }
  66%, 100% { opacity: 0; transform: translate(30px, 0); }
}
@keyframes ci-results {
  0%, 66%, 100% { opacity: .15; }
  75%, 94% { opacity: 1; }
}
@keyframes ci-result-bars {
  0%, 66%, 100% { transform: scaleY(.1); }
  75%, 94% { transform: scaleY(1); }
}
/* 6–8s: hold the completed result and smoothly reset. */
@media (prefers-reduced-motion: reduce) {
  .chainideas-artwork * { animation: none !important; }
.chainideas-artwork .ci-token { display: none; }
.chainideas-artwork .ci-criterion-fill, .chainideas-artwork .ci-result-row { opacity: 1; }
.chainideas-artwork .ci-bar { transform: none; }
}
</style>
  <g id="chainideas-connection-lines" fill="none" stroke-width="1.7" stroke-dasharray="5 8" stroke-linecap="round">
    <path id="chainideas-solana-route" d="M134 156 C164 155 172 183 213 187" stroke="#a4aa93" />
    <path id="chainideas-robinhood-route" d="M134 277 C165 276 179 242 213 235" stroke="#c8ab89" />
    <path id="chainideas-qualified-route" d="M332 211 C364 210 382 211 400 211" stroke="#b6a28a" />
  </g>
  <g id="chainideas-sources">
    <g id="chainideas-solana-source" class="ci-outline">
      <path d="M40 133V177C40 194 134 194 134 177V133" fill="#e5e1d6" />
      <ellipse cx="87" cy="133" rx="47" ry="17" fill="#d9e5d4" />
      <ellipse cx="87" cy="133" rx="34" ry="10" fill="none" stroke="#b2c1a6" />
      <path d="M79 127h24l-5 4H74zM77 135h24l-5 4H72z" fill="#849b82" stroke="none" />
    </g>
    <text class="ci-mono" x="87" y="109" font-size="11" text-anchor="middle">SOLANA</text>
    <g id="chainideas-robinhood-source" class="ci-outline">
      <path d="M40 257V300C40 317 134 317 134 300V257" fill="#e5e1d6" />
      <ellipse cx="87" cy="257" rx="47" ry="17" fill="#d9e5d4" />
      <ellipse cx="87" cy="257" rx="34" ry="10" fill="none" stroke="#b2c1a6" />
      <path d="M78 264L97 245l12-1-19 26-5-8 9-9z" fill="#849b82" stroke="none" />
    </g>
    <text class="ci-mono" x="87" y="333" font-size="10.5" text-anchor="middle">ROBINHOOD CHAIN</text>
  </g>
  <g id="chainideas-incoming-tokens" class="ci-outline">
    <g id="chainideas-solana-token" class="ci-token">
      <rect x="166" y="167" width="20" height="27" rx="2" fill="#eee9df" />
      <path d="M171 176h9M171 183h9" class="ci-fine" fill="none" />
    </g>
    <g id="chainideas-robinhood-token" class="ci-token">
      <rect x="166" y="247" width="20" height="27" rx="2" fill="#eee9df" />
      <path d="M171 256h9M171 263h9" class="ci-fine" fill="none" />
