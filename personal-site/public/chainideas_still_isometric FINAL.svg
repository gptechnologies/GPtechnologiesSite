<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-label="Solana and Robinhood Chain flow into discovery screening criteria and qualified pairs dashboard">
<title>ChainIdeas — Discovery engine</title>
<defs>
 <style><![CDATA[
 .outline{stroke:#9c9080;stroke-width:1.35;stroke-linejoin:round;stroke-linecap:round}
 .fine{stroke:#c6bcae;stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
 .mono{font-family:'IBM Plex Mono','Courier New',monospace;fill:#817669;letter-spacing:1.05px}
 ]]></style>
</defs>
<g id="canvas"><rect width="560" height="430" fill="#f7f5f0"/></g>
<g id="figure-labels" class="mono" font-size="10.5"><text x="30" y="32">FIG. 01</text><text x="530" y="32" text-anchor="end">THE DISCOVERY ENGINE</text></g>
<!-- Soft guide lines rather than a base/platform -->
<g id="connection-lines" fill="none" stroke-width="1.7" stroke-dasharray="5 8" stroke-linecap="round">
 <path id="solana-route" d="M134 156 C164 155 172 183 213 187" stroke="#a4aa93"/>
 <path id="robinhood-route" d="M134 277 C165 276 179 242 213 235" stroke="#c8ab89"/>
 <path id="qualified-route" d="M332 211 C364 210 382 211 400 211" stroke="#b6a28a"/>
</g>
<g id="sources">
