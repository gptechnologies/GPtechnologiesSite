  <path d="M79 127h24l-5 4H74zM77 135h24l-5 4H72z" fill="#849b82" stroke="none"/>
 </g>
 <text class="mono" x="87" y="109" font-size="11" text-anchor="middle">SOLANA</text>
 <g id="robinhood-source" class="outline">
  <path d="M40 257V300C40 317 134 317 134 300V257" fill="#e5e1d6"/>
  <ellipse cx="87" cy="257" rx="47" ry="17" fill="#d9e5d4"/>
  <ellipse cx="87" cy="257" rx="34" ry="10" fill="none" stroke="#b2c1a6"/>
  <path d="M78 264L97 245l12-1-19 26-5-8 9-9z" fill="#849b82" stroke="none"/>
 </g>
 <text class="mono" x="87" y="333" font-size="10.5" text-anchor="middle">ROBINHOOD CHAIN</text>
</g>
<g id="incoming-tokens" class="outline">
 <g id="solana-token"><rect x="166" y="167" width="20" height="27" rx="2" fill="#eee9df"/><path d="M171 176h9M171 183h9" class="fine" fill="none"/></g>
 <g id="robinhood-token"><rect x="166" y="247" width="20" height="27" rx="2" fill="#eee9df"/><path d="M171 256h9M171 263h9" class="fine" fill="none"/></g>
</g>
<g id="engine">
 <text class="mono" x="274" y="97" font-size="11" text-anchor="middle">DISCOVERY ENGINE</text>
