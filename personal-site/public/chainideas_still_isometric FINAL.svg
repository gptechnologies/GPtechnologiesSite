  <g id="qualified-row-2"><circle cx="416" cy="180" r="4.5" fill="#a5b29e"/><path d="M428 177h31M428 183h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round"/><g fill="#93a98f"><rect x="473" y="175" width="5" height="16"/><rect x="482" y="169" width="5" height="22"/></g><rect x="491" y="178" width="5" height="13" fill="#c99f84"/></g>
  <g id="qualified-row-3"><circle cx="416" cy="208" r="4.5" fill="#a5b29e"/><path d="M428 205h31M428 211h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round"/><g fill="#93a98f"><rect x="473" y="206" width="5" height="13"/><rect x="482" y="199" width="5" height="20"/></g><rect x="491" y="195" width="5" height="24" fill="#c99f84"/></g>
  <g id="qualified-row-4"><circle cx="416" cy="236" r="4.5" fill="#a5b29e"/><path d="M428 233h31M428 239h21" stroke="#d0c9bf" stroke-width="3" stroke-linecap="round"/><g fill="#93a98f"><rect x="473" y="235" width="5" height="12"/><rect x="482" y="226" width="5" height="21"/></g><rect x="491" y="220" width="5" height="27" fill="#c99f84"/></g>
 </g>
</g>
<g id="footer" class="mono" font-size="10.5"><circle cx="31" cy="394" r="3.5" fill="#81947d"/><text x="43" y="398">Discover / screen / qualify</text><text x="529" y="398" text-anchor="end">ILLUSTRATION</text></g>
